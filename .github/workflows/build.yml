name: Build Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Linux amd64：ubuntu runner 原生即 x86_64，直接构建。
      - name: Build linux/amd64
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -buildmode=c-shared -o build/linux/amd64/cli-runner.so .

      # Linux arm64：用 gcc-aarch64-linux-gnu 交叉编译。
      - name: Build linux/arm64
        run: |
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -buildmode=c-shared -o build/linux/arm64/cli-runner.so .

      # 按插件源要求的命名打包：zip 根目录为 cli-runner.so
      - name: Package release assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION="0.1.0"
          mkdir -p release
          (cd build/linux/amd64 && zip -q "$OLDPWD/release/cli-runner_${VERSION}_linux_amd64.zip" cli-runner.so)
          (cd build/linux/arm64 && zip -q "$OLDPWD/release/cli-runner_${VERSION}_linux_arm64.zip" cli-runner.so)
          (cd release && shasum -a 256 * > checksums.txt)
          ls -la release/

      # 打 tag 时创建 Release 并上传资产
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cli-runner_*_linux_amd64.zip
            release/cli-runner_*_linux_arm64.zip
            release/checksums.txt
        fail_on_unmatched_files: true
